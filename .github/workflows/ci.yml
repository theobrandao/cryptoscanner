name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-secret-with-at-least-thirty-two-characters
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke-production:
    name: Smoke em produção (após deploy da Vercel)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aguardar deploy com o commit atual
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/health" || true)
            [ "$code" = "200" ] && break
            sleep 10
          done
          sleep 90
      - name: Smoke das APIs
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
          SKIP_RATE_LIMIT: "1"
        run: node tools/api-smoke.mjs
