name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: ci-secret-with-at-least-thirty-two-characters
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  smoke-production:
    name: Smoke em produção (após deploy da Vercel)
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aguardar deploy com o commit atual
        env:
          # sem a variável do repositório, usa a URL pública de produção
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://cryptoscanner-five.vercel.app' }}
          SHA: ${{ github.sha }}
        run: |
          for i in $(seq 1 60); do
            commit=$(curl -s "$BASE_URL/api/health" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).data.commit??"")}catch{console.log("")}})')
            if [ "$commit" = "$SHA" ]; then echo "deploy $SHA no ar"; exit 0; fi
            sleep 10
          done
          echo "::warning title=Deploy não confirmado::após 10 min a produção responde commit '${commit:-desconhecido}', esperado $SHA; smoke roda contra a versão atual"
      - name: Smoke das APIs
        env:
          BASE_URL: ${{ vars.PRODUCTION_URL || 'https://cryptoscanner-five.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INVITE_CODE: ${{ secrets.INVITE_CODE }}
          SKIP_RATE_LIMIT: "1"
        run: node tools/api-smoke.mjs
